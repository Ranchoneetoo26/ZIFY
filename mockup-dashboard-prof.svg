<svg width="1440" height="1200" viewBox="0 0 1440 1200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect width="1440" height="1200" fill="#121212"/>
  
  <!-- TOP NAV (GLASSMORPHISM) -->
  <rect width="1440" height="80" fill="#1E1E1E"/>
  <text x="60" y="50" fill="white" font-family="Inter, sans-serif" font-size="24" font-weight="900">ZYFT<tspan fill="#FFC629">.</tspan></text>
  
  <g transform="translate(400, 30)" font-family="Inter, sans-serif" font-size="14" font-weight="600">
    <text x="0" y="20" fill="white">Dashboard</text>
    <text x="120" y="20" fill="#666666">Projetos</text>
    <text x="220" y="20" fill="#666666">Candidaturas</text>
    <text x="350" y="20" fill="#666666">Mensagens</text>
  </g>
  
  <g transform="translate(1200, 20)">
    <circle cx="20" cy="20" r="20" fill="#333333"/>
    <text x="50" y="18" fill="white" font-family="Inter, sans-serif" font-size="14" font-weight="bold">Marina O.</text>
    <text x="50" y="35" fill="#FFC629" font-family="Inter, sans-serif" font-size="12">Dual Premium</text>
  </g>

  <!-- CONTENT GRID -->
  <g transform="translate(60, 120)">
    <!-- LEFT COLUMN: WELCOME & STATS -->
    <g>
      <text fill="white" font-family="Inter, sans-serif" font-size="36" font-weight="900" letter-spacing="-0.03em">Bom dia, Marina!</text>
      <text y="35" fill="#666666" font-family="Inter, sans-serif" font-size="16">Seu perfil teve 42 novas visualizações nas últimas 24h.</text>
      
      <g transform="translate(0, 80)">
        <!-- STAT 1 -->
        <rect width="400" height="240" rx="32" fill="#1E1E1E" stroke="#333333"/>
        <text x="30" y="45" fill="#666666" font-family="Inter, sans-serif" font-size="12" font-weight="bold" letter-spacing="0.1em">REPUTAÇÃO ATUAL</text>
        <text x="30" y="110" fill="#FFC629" font-family="Inter, sans-serif" font-size="72" font-weight="900">4.9</text>
        <text x="150" y="90" fill="#444444" font-family="Inter, sans-serif" font-size="24">★</text>
        
        <rect x="30" y="150" width="340" height="60" rx="16" fill="#121212"/>
        <text x="50" y="185" fill="#28A745" font-family="Inter, sans-serif" font-size="14" font-weight="bold">↑ 2% em relação ao mês anterior</text>
      </g>
      
      <g transform="translate(0, 340)">
        <!-- STAT 2 -->
        <rect width="400" height="240" rx="32" fill="#1E1E1E" stroke="#333333"/>
        <text x="30" y="45" fill="#666666" font-family="Inter, sans-serif" font-size="12" font-weight="bold" letter-spacing="0.1em">GANHOS ESTIMADOS (MÊS)</text>
        <text x="30" y="110" fill="white" font-family="Inter, sans-serif" font-size="48" font-weight="900">R$ 18.450</text>
        <text x="30" y="145" fill="#666666" font-family="Inter, sans-serif" font-size="14">3 projetos ativos · 0% taxas pagas</text>
        
        <!-- MINI CHART -->
        <path d="M30 200 L100 180 L180 190 L260 160 L340 170" stroke="#FFC629" stroke-width="3" fill="none"/>
      </g>
    </g>
    
    <!-- MIDDLE COLUMN: FEED -->
    <g transform="translate(430, 0)">
      <text fill="white" font-family="Inter, sans-serif" font-size="24" font-weight="900">Oportunidades Recomendadas</text>
      
      <g transform="translate(0, 40)">
        <!-- Job Card 1 -->
        <rect width="550" height="180" rx="28" fill="#1E1E1E" stroke="#FFC629" stroke-opacity="0.3"/>
        <rect x="25" y="25" width="60" height="60" rx="16" fill="#121212"/>
        <text x="100" y="50" fill="white" font-family="Inter, sans-serif" font-size="18" font-weight="bold">Staff Engineer (Go / Kubernetes)</text>
        <text x="100" y="75" fill="#666666" font-family="Inter, sans-serif" font-size="14">TechGlobal S.A. · Remoto · PJ</text>
        
        <g transform="translate(100, 100)">
          <rect width="80" height="24" rx="12" fill="#333333"/>
          <text x="40" y="16" fill="#B3B3B3" font-family="Inter, sans-serif" font-size="11" text-anchor="middle">Kubernetes</text>
          <rect x="90" width="60" height="24" rx="12" fill="#333333"/>
          <text x="120" y="16" fill="#B3B3B3" font-family="Inter, sans-serif" font-size="11" text-anchor="middle">GoLang</text>
        </g>
        
        <text x="525" y="50" fill="#FFC629" font-family="Inter, sans-serif" font-size="20" font-weight="900" text-anchor="end">R$ 110/h</text>
        <rect x="410" y="120" width="115" height="40" rx="12" fill="#FFC629"/>
        <text x="467" y="145" fill="black" font-family="Inter, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">CANDIDATAR</text>
      </g>
      
      <g transform="translate(0, 240)">
        <!-- Job Card 2 -->
        <rect width="550" height="180" rx="28" fill="#1E1E1E" stroke="#333333"/>
        <rect x="25" y="25" width="60" height="60" rx="16" fill="#121212"/>
        <text x="100" y="50" fill="white" font-family="Inter, sans-serif" font-size="18" font-weight="bold">Backend Sênior (Node.js)</text>
        <text x="100" y="75" fill="#666666" font-family="Inter, sans-serif" font-size="14">FinFuture · Híbrido · CLT</text>
        
        <text x="525" y="50" fill="white" font-family="Inter, sans-serif" font-size="20" font-weight="900" text-anchor="end">R$ 16k</text>
        <rect x="410" y="120" width="115" height="40" rx="12" stroke="#333333" fill="none"/>
        <text x="467" y="145" fill="white" font-family="Inter, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">DETALHES</text>
      </g>
    </g>
    
    <!-- RIGHT COLUMN: QUEUE & NOTIFICATIONS -->
    <g transform="translate(1010, 0)">
      <rect width="310" height="420" rx="32" fill="#1E1E1E" stroke="#333333"/>
      <text x="30" y="45" fill="#666666" font-family="Inter, sans-serif" font-size="12" font-weight="bold" letter-spacing="0.1em">SUAS FILAS ATIVAS</text>
      
      <g transform="translate(20, 70)">
        <rect width="270" height="80" rx="20" fill="#121212" stroke="#28A745" stroke-opacity="0.3"/>
        <text x="20" y="35" fill="white" font-family="Inter, sans-serif" font-size="14" font-weight="bold">Staff Engineer</text>
        <text x="20" y="55" fill="#28A745" font-family="Inter, sans-serif" font-size="12">Você é o 1º na fila</text>
        <circle cx="240" cy="40" r="8" fill="#28A745"/>
      </g>
      
      <g transform="translate(20, 165)">
        <rect width="270" height="80" rx="20" fill="#121212" stroke="#333333"/>
        <text x="20" y="35" fill="white" font-family="Inter, sans-serif" font-size="14" font-weight="bold">Backend Sênior</text>
        <text x="20" y="55" fill="#666666" font-family="Inter, sans-serif" font-size="12">Você é o 4º na fila</text>
      </g>
      
      <rect x="30" y="350" width="250" height="40" rx="12" fill="#FFC629" fill-opacity="0.1"/>
      <text x="155" y="375" fill="#FFC629" font-family="Inter, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Ver todas as filas</text>
    </g>
  </g>
</svg>
