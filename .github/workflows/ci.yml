name: CI

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:
    branches: [main]

jobs:
  build-test:
    name: Build e testes (.NET 8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore Zyft.sln
      - name: Build
        run: dotnet build Zyft.sln -c Release --no-restore
      - name: Testes (unidade, integração, aceitação)
        run: dotnet test Zyft.sln -c Release --no-build --logger "trx" --collect:"XPlat Code Coverage" --results-directory TestResults
      - name: Publica resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
      - name: Migrations em dia com o modelo
        run: |
          dotnet tool restore
          dotnet ef migrations has-pending-model-changes --project src/Zyft.Infrastructure --startup-project src/Zyft.Infrastructure

  docker:
    name: Imagem Docker da API
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - name: Build da imagem
        run: docker build -f src/Zyft.Api/Dockerfile -t zyft-api:ci .
      - name: Sobe com PostgreSQL e confere /health
        run: |
          docker compose up -d --build
          for i in $(seq 1 30); do curl -fs http://localhost:5080/health && break; sleep 2; done
          curl -fs http://localhost:5080/health
          docker compose logs api | tail -50
          docker compose down -v
        env:
          ZYFT_LLM_PROVIDER: None
