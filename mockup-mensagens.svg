<svg width="1440" height="900" viewBox="0 0 1440 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1440" height="900" fill="#121212"/>
  
  <!-- Header (Dashboard Style) -->
  <rect width="1440" height="80" fill="#1E1E1E" stroke="#333333"/>
  <text x="80" y="50" fill="white" font-family="Inter, sans-serif" font-size="24" font-weight="bold">ZYFT<tspan fill="#FFC629">.</tspan></text>
  
  <!-- Chat Container -->
  <g transform="translate(80, 120)">
    <rect width="1280" height="700" rx="32" fill="#1E1E1E" stroke="#333333"/>
    
    <!-- Contacts Sidebar -->
    <g>
      <rect width="350" height="700" rx="32" fill="#121212" fill-opacity="0.5"/>
      <text x="30" y="50" fill="white" font-family="Inter, sans-serif" font-size="20" font-weight="bold">Conversas</text>
      
      <!-- Contact 1 (Active) -->
      <g transform="translate(0, 80)">
        <rect width="350" height="100" fill="#FFC629" fill-opacity="0.1"/>
        <rect width="4" height="100" fill="#FFC629"/>
        <circle cx="50" cy="50" r="24" fill="#333333"/>
        <text x="90" y="45" fill="white" font-family="Inter, sans-serif" font-size="16" font-weight="bold">TechCorp Solutions</text>
        <text x="90" y="65" fill="#FFC629" font-family="Inter, sans-serif" font-size="14">Digitando...</text>
        <text x="320" y="45" fill="#666666" font-family="Inter, sans-serif" font-size="12" text-anchor="end">14:32</text>
      </g>
      
      <!-- Contact 2 -->
      <g transform="translate(0, 180)">
        <circle cx="50" cy="50" r="24" fill="#333333"/>
        <text x="90" y="45" fill="#B3B3B3" font-family="Inter, sans-serif" font-size="16" font-weight="bold">FinFuture Bank</text>
        <text x="90" y="65" fill="#666666" font-family="Inter, sans-serif" font-size="14">Olá Marina, vimos seu perfil...</text>
      </g>
    </g>
    
    <!-- Chat Area -->
    <g transform="translate(350, 0)">
      <!-- Top Bar -->
      <rect width="930" height="80" fill="#1E1E1E" stroke="#333333"/>
      <circle cx="50" cy="40" r="20" fill="#333333"/>
      <text x="85" y="40" fill="white" font-family="Inter, sans-serif" font-size="18" font-weight="bold">TechCorp Solutions</text>
      <text x="85" y="58" fill="#28A745" font-family="Inter, sans-serif" font-size="12">Online agora</text>
      
      <rect x="720" y="20" width="180" height="40" rx="8" fill="#FFC629"/>
      <text x="810" y="45" fill="black" font-family="Inter, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Liberar Contato</text>
      
      <!-- Messages Area -->
      <g transform="translate(40, 120)">
        <!-- Received -->
        <rect width="400" height="80" rx="16" fill="#121212"/>
        <text x="20" y="35" fill="white" font-family="Inter, sans-serif" font-size="14">Olá Marina! Gostamos muito da sua nota 4.9 no Zyft. Você tem disponibilidade para um projeto PJ de 3 meses?</text>
        
        <!-- Sent -->
        <g transform="translate(450, 100)">
          <rect width="400" height="60" rx="16" fill="#FFC629"/>
          <text x="20" y="35" fill="black" font-family="Inter, sans-serif" font-size="14">Olá! Sim, tenho disponibilidade. Qual seria a stack principal?</text>
        </g>
      </g>
      
      <!-- Input Area -->
      <g transform="translate(30, 620)">
        <rect width="870" height="50" rx="25" fill="#121212" stroke="#333333"/>
        <text x="25" y="32" fill="#333333" font-family="Inter, sans-serif" font-size="14">Escreva sua mensagem...</text>
        <circle cx="845" cy="25" r="18" fill="#FFC629"/>
        <path d="M840 20L850 25L840 30" stroke="black" stroke-width="2" fill="none"/>
      </g>
    </g>
  </g>
</svg>
