<svg width="1440" height="4200" viewBox="0 0 1440 4200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="hero_grad" x1="720" y1="0" x2="720" y2="800" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1A1A1A"/>
      <stop offset="1" stop-color="#121212"/>
    </linearGradient>
    <linearGradient id="card_grad" x1="0" y1="0" x2="300" y2="500" gradientUnits="userSpaceOnUse">
      <stop stop-color="#252525"/>
      <stop offset="1" stop-color="#1E1E1E"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="1440" height="4200" fill="#121212"/>
  
  <!-- BACKGROUND DECORATION -->
  <circle cx="1200" cy="400" r="300" fill="#FFC629" fill-opacity="0.03" filter="url(#glow)"/>
  <circle cx="100" cy="1200" r="400" fill="#FFC629" fill-opacity="0.02" filter="url(#glow)"/>

  <!-- HEADER (STICKY STYLE) -->
  <rect width="1440" height="90" fill="#121212" fill-opacity="0.8" style="backdrop-filter: blur(20px)"/>
  <line x1="0" y1="90" x2="1440" y2="90" stroke="#333333" stroke-width="0.5"/>
  
  <text x="80" y="55" fill="white" font-family="Inter, sans-serif" font-size="32" font-weight="900" letter-spacing="-0.05em">ZYFT<tspan fill="#FFC629">.</tspan></text>
  
  <g font-family="Inter, sans-serif" font-size="15" font-weight="600" letter-spacing="0.02em">
    <text x="320" y="52" fill="white">Encontrar Talentos</text>
    <path d="M465 47L470 52L475 47" stroke="white" stroke-width="2"/>
    
    <text x="520" y="52" fill="#B3B3B3">Buscar Projetos</text>
    <text x="660" y="52" fill="#B3B3B3">Soluções Enterprise</text>
    <text x="840" y="52" fill="#B3B3B3">Preços</text>
  </g>
  
  <text x="1140" y="52" fill="white" font-family="Inter, sans-serif" font-size="16" font-weight="700">Login</text>
  <rect x="1220" y="23" width="140" height="44" rx="12" fill="#FFC629"/>
  <text x="1290" y="51" fill="black" font-family="Inter, sans-serif" font-size="16" font-weight="800" text-anchor="middle">CADASTRE-SE</text>

  <!-- HERO SECTION -->
  <g transform="translate(80, 220)">
    <rect x="-20" y="-40" width="600" height="400" fill="url(#hero_grad)" rx="40" opacity="0.5"/>
    <text y="20" fill="white" font-family="Inter, sans-serif" font-size="80" font-weight="900" letter-spacing="-0.04em" line-height="1.1">Onde o código<br/>encontra a <tspan fill="#FFC629">confiança.</tspan></text>
    
    <text y="220" fill="#888888" font-family="Inter, sans-serif" font-size="24" max-width="600">O primeiro marketplace híbrido (PJ &amp; CLT) com comissão zero e reputação bilateral validada por IA.</text>
    
    <g transform="translate(0, 300)">
      <rect width="320" height="72" rx="16" fill="#FFC629" filter="url(#glow)"/>
      <text x="160" y="44" fill="black" font-family="Inter, sans-serif" font-size="20" font-weight="900" text-anchor="middle">CONTRATAR AGORA</text>
      
      <rect x="340" width="300" height="72" rx="16" stroke="#444444" stroke-width="2"/>
      <text x="490" y="44" fill="white" font-family="Inter, sans-serif" font-size="20" font-weight="700" text-anchor="middle">QUERO TRABALHAR</text>
    </g>
    
    <!-- SOCIAL PROOF -->
    <g transform="translate(0, 420)">
      <text fill="#555555" font-family="Inter, sans-serif" font-size="14" font-weight="bold" letter-spacing="0.1em">CONFIADO POR TIMES EM:</text>
      <text x="0" y="40" fill="#333333" font-family="Inter, sans-serif" font-size="24" font-weight="bold">TECHCORP · FINFUTURE · CLOUDLY · NEXUS</text>
    </g>
  </g>

  <!-- DYNAMIC QUEUE VISUAL (REFINED) -->
  <g transform="translate(820, 180)">
    <rect width="540" height="500" rx="40" fill="#1E1E1E" stroke="#333333" stroke-width="1"/>
    <rect x="30" y="30" width="480" height="60" rx="12" fill="#121212"/>
    <text x="50" y="67" fill="#FFC629" font-family="Inter, sans-serif" font-size="14" font-weight="900" letter-spacing="0.1em">MATCHING EM TEMPO REAL</text>
    
    <g transform="translate(30, 110)">
      <!-- Top Talent -->
      <rect width="480" height="110" rx="20" fill="#000000" stroke="#FFC629" stroke-width="2"/>
      <circle cx="50" cy="55" r="30" fill="#222222"/>
      <text x="95" y="45" fill="white" font-family="Inter, sans-serif" font-size="20" font-weight="bold">Marina Oliveira</text>
      <text x="95" y="70" fill="#666666" font-family="Inter, sans-serif" font-size="14">Sênior Backend · Java, Go, AWS</text>
      
      <g transform="translate(95, 85)">
        <rect width="60" height="18" rx="9" fill="#FFC629" fill-opacity="0.2"/>
        <text x="30" y="13" fill="#FFC629" font-family="Inter, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">DISPONÍVEL</text>
      </g>
      
      <text x="450" y="60" fill="#FFC629" font-family="Inter, sans-serif" font-size="28" font-weight="900" text-anchor="end">4.9</text>
      <text x="450" y="80" fill="#444444" font-family="Inter, sans-serif" font-size="12" font-weight="bold" text-anchor="end">REPUTAÇÃO</text>
    </g>
    
    <g transform="translate(30, 235)">
      <rect width="480" height="110" rx="20" fill="#151515" stroke="#222222"/>
      <circle cx="50" cy="55" r="30" fill="#222222"/>
      <text x="95" y="45" fill="#B3B3B3" font-family="Inter, sans-serif" font-size="20" font-weight="bold">Diego Ferreira</text>
      <text x="450" y="60" fill="#888888" font-family="Inter, sans-serif" font-size="28" font-weight="900" text-anchor="end">4.7</text>
    </g>

    <g transform="translate(30, 360)">
      <rect width="480" height="110" rx="20" fill="#151515" stroke="#222222" opacity="0.4"/>
      <circle cx="50" cy="55" r="30" fill="#222222"/>
      <text x="95" y="45" fill="#555555" font-family="Inter, sans-serif" font-size="20" font-weight="bold">Aline Rocha</text>
    </g>
  </g>

  <!-- CATEGORIES GRID (ENRICHED) -->
  <g transform="translate(80, 850)">
    <text fill="white" font-family="Inter, sans-serif" font-size="48" font-weight="900" letter-spacing="-0.02em">Explore por Especialidade</text>
    <text y="40" fill="#666666" font-family="Inter, sans-serif" font-size="18">Encontre especialistas prontos para escalar seu produto.</text>
    
    <g transform="translate(0, 100)">
      <!-- Row 1 -->
      <rect width="300" height="220" rx="32" fill="url(#card_grad)" stroke="#333333"/>
      <text x="40" y="60" fill="#FFC629" font-size="40">&lt;/&gt;</text>
      <text x="40" y="120" fill="white" font-family="Inter, sans-serif" font-size="22" font-weight="bold">Desenvolvimento</text>
      <text x="40" y="150" fill="#666666" font-family="Inter, sans-serif" font-size="14">Frontend, Backend, Mobile, Fullstack</text>
      <text x="40" y="185" fill="#FFC629" font-family="Inter, sans-serif" font-size="14" font-weight="bold">12.4k profissionais →</text>
      
      <rect x="325" width="300" height="220" rx="32" fill="url(#card_grad)" stroke="#333333"/>
      <text x="365" y="60" fill="#FFC629" font-size="40">🎨</text>
      <text x="365" y="120" fill="white" font-family="Inter, sans-serif" font-size="22" font-weight="bold">Design &amp; Produto</text>
      <text x="365" y="150" fill="#666666" font-family="Inter, sans-serif" font-size="14">UI/UX, Product Design, Branding</text>
      
      <rect x="650" width="300" height="220" rx="32" fill="url(#card_grad)" stroke="#333333"/>
      <text x="690" y="60" fill="#FFC629" font-size="40">📊</text>
      <text x="690" y="120" fill="white" font-family="Inter, sans-serif" font-size="22" font-weight="bold">Dados &amp; IA</text>
      
      <rect x="975" width="300" height="220" rx="32" fill="url(#card_grad)" stroke="#333333"/>
      <text x="1015" y="60" fill="#FFC629" font-size="40">☁️</text>
      <text x="1015" y="120" fill="white" font-family="Inter, sans-serif" font-size="22" font-weight="bold">Cloud &amp; DevOps</text>
    </g>
  </g>

  <!-- VALUE PROPOSITION (ROBUST SECTION) -->
  <rect y="1250" width="1440" height="800" fill="#1A1A1A"/>
  <g transform="translate(80, 1350)">
    <text fill="#FFC629" font-family="Inter, sans-serif" font-size="16" font-weight="900" letter-spacing="0.2em">POR QUE O ZYFT?</text>
    <text y="60" fill="white" font-family="Inter, sans-serif" font-size="56" font-weight="900" letter-spacing="-0.03em">Transparência total,<br/>sem comissões ocultas.</text>
    
    <g transform="translate(0, 180)">
      <g>
        <rect width="380" height="300" rx="32" fill="#121212" stroke="#333333"/>
        <text x="40" y="60" fill="#FFC629" font-size="40">0%</text>
        <text x="40" y="120" fill="white" font-family="Inter, sans-serif" font-size="24" font-weight="bold">Comissão Zero</text>
        <text x="40" y="160" fill="#666666" font-family="Inter, sans-serif" font-size="16" line-height="1.5">Diferente de outros marketplaces, não tiramos um centavo do seu contrato. O valor negociado é 100% seu.</text>
      </g>
      
      <g transform="translate(430, 0)">
        <rect width="380" height="300" rx="32" fill="#121212" stroke="#333333"/>
        <text x="40" y="60" fill="#FFC629" font-size="40">★</text>
        <text x="40" y="120" fill="white" font-family="Inter, sans-serif" font-size="24" font-weight="bold">Reputação Bilateral</text>
        <text x="40" y="160" fill="#666666" font-family="Inter, sans-serif" font-size="16" line-height="1.5">Empresas e profissionais avaliam um ao outro. Notas imutáveis que constroem carreiras sólidas.</text>
      </g>
      
      <g transform="translate(860, 0)">
        <rect width="380" height="300" rx="32" fill="#121212" stroke="#333333"/>
        <text x="40" y="60" fill="#FFC629" font-size="40">⚖️</text>
        <text x="40" y="120" fill="white" font-family="Inter, sans-serif" font-size="24" font-weight="bold">Híbrido PJ &amp; CLT</text>
        <text x="40" y="160" fill="#666666" font-family="Inter, sans-serif" font-size="16" line-height="1.5">A flexibilidade que o mercado de TI exige. Transite entre modalidades com um único perfil.</text>
      </g>
    </g>
  </g>

  <!-- PRICING SECTION (HIGH DENSITY) -->
  <g transform="translate(80, 2150)">
    <text fill="white" font-family="Inter, sans-serif" font-size="48" font-weight="900" text-anchor="middle" x="640">Planos de Assinatura</text>
    <text y="50" fill="#666666" font-family="Inter, sans-serif" font-size="20" text-anchor="middle" x="640">Escolha a trilha que melhor se adapta ao seu momento profissional.</text>
    
    <g transform="translate(0, 150)">
      <!-- PJ -->
      <rect width="300" height="600" rx="40" fill="#1E1E1E" stroke="#333333"/>
      <text x="40" y="60" fill="#B3B3B3" font-family="Inter, sans-serif" font-size="18" font-weight="bold">TRILHA PJ</text>
      <text x="40" y="120" fill="white" font-family="Inter, sans-serif" font-size="48" font-weight="900">R$ 49<tspan font-size="20" fill="#666666">/mês</tspan></text>
      
      <g transform="translate(40, 180)" fill="#888888" font-family="Inter, sans-serif" font-size="16">
        <text y="0">✓ 20 Candidaturas/mês</text>
        <text y="40">✓ Selo PJ Validado</text>
        <text y="80">✓ Suporte via Chat</text>
        <text y="120">✓ Insights de Salário</text>
      </g>
      <rect x="40" y="500" width="220" height="56" rx="16" stroke="#444444" fill="none"/>
      <text x="150" y="535" fill="white" font-family="Inter, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">ASSINAR PJ</text>

      <!-- CLT -->
      <rect x="325" width="300" height="600" rx="40" fill="#1E1E1E" stroke="#333333"/>
      <text x="365" y="60" fill="#B3B3B3" font-family="Inter, sans-serif" font-size="18" font-weight="bold">TRILHA CLT</text>
      <text x="365" y="120" fill="white" font-family="Inter, sans-serif" font-size="48" font-weight="900">R$ 49<tspan font-size="20" fill="#666666">/mês</tspan></text>

      <!-- DUAL (PREMIUM FOCUS) -->
      <rect x="650" y="-20" width="320" height="640" rx="40" fill="#121212" stroke="#FFC629" stroke-width="3" filter="url(#glow)"/>
      <rect x="730" y="-40" width="160" height="32" rx="16" fill="#FFC629"/>
      <text x="810" y="-19" fill="black" font-family="Inter, sans-serif" font-size="12" font-weight="900" text-anchor="middle">MAIS VANTAGEM</text>
      
      <text x="690" y="60" fill="white" font-family="Inter, sans-serif" font-size="22" font-weight="900">DUAL PJ &amp; CLT</text>
      <text x="690" y="120" fill="#FFC629" font-family="Inter, sans-serif" font-size="56" font-weight="900">R$ 144<tspan font-size="20" fill="#666666">/mês</tspan></text>
      
      <g transform="translate(690, 180)" fill="white" font-family="Inter, sans-serif" font-size="16" font-weight="500">
        <text y="0">✓ Candidaturas Ilimitadas</text>
        <text y="40">✓ Acesso Full (PJ + CLT)</text>
        <text y="80">✓ Prioridade no Matching</text>
        <text y="120">✓ Selo Destaque no Perfil</text>
        <text y="160">✓ Análise de Currículo IA</text>
      </g>
      <rect x="690" y="500" width="240" height="64" rx="16" fill="#FFC629"/>
      <text x="810" y="540" fill="black" font-family="Inter, sans-serif" font-size="18" font-weight="900" text-anchor="middle">QUERO SER DUAL</text>

      <!-- EMPRESA -->
      <rect x="995" width="300" height="600" rx="40" fill="#1E1E1E" stroke="#333333"/>
      <text x="1035" y="60" fill="#B3B3B3" font-family="Inter, sans-serif" font-size="18" font-weight="bold">EMPRESA</text>
      <text x="1035" y="120" fill="white" font-family="Inter, sans-serif" font-size="48" font-weight="900">R$ 289<tspan font-size="20" fill="#666666">/mês</tspan></text>
    </g>
  </g>

  <!-- TESTIMONIALS (REAL FEEL) -->
  <g transform="translate(80, 2900)">
    <text fill="white" font-family="Inter, sans-serif" font-size="40" font-weight="900">O que dizem os especialistas</text>
    <g transform="translate(0, 80)">
      <rect width="600" height="200" rx="32" fill="#1E1E1E" stroke="#333333"/>
      <text x="40" y="60" fill="white" font-family="Inter, sans-serif" font-size="18" font-style="italic">"O Zyft mudou minha forma de ver projetos PJ. A comissão zero faz toda a diferença no final do mês."</text>
      <g transform="translate(40, 130)">
        <circle r="24" fill="#333333"/>
        <text x="35" y="5" fill="white" font-family="Inter, sans-serif" font-size="16" font-weight="bold">Carlos Mendes</text>
        <text x="35" y="25" fill="#666666" font-family="Inter, sans-serif" font-size="14">Tech Lead na Cloudly</text>
      </g>
      
      <rect x="630" width="600" height="200" rx="32" fill="#1E1E1E" stroke="#333333"/>
      <text x="670" y="60" fill="white" font-family="Inter, sans-serif" font-size="18" font-style="italic">"Contratar pelo banco de talentos do Zyft é 3x mais rápido que processos tradicionais."</text>
    </g>
  </g>

  <!-- CTA FINAL -->
  <g transform="translate(80, 3200)">
    <rect width="1280" height="400" rx="48" fill="#FFC629"/>
    <text x="640" y="120" fill="black" font-family="Inter, sans-serif" font-size="56" font-weight="900" text-anchor="middle" letter-spacing="-0.04em">Pronto para subir na fila?</text>
    <text x="640" y="170" fill="black" fill-opacity="0.6" font-family="Inter, sans-serif" font-size="22" text-anchor="middle">Junte-se a 50.000+ profissionais e empresas de tecnologia.</text>
    <rect x="490" y="240" width="300" height="72" rx="20" fill="black"/>
    <text x="640" y="285" fill="white" font-family="Inter, sans-serif" font-size="20" font-weight="900" text-anchor="middle">CRIAR CONTA GRÁTIS</text>
  </g>

  <!-- MEGA FOOTER -->
  <rect y="3750" width="1440" height="450" fill="#0A0A0A"/>
  <g transform="translate(80, 3850)">
    <text fill="white" font-family="Inter, sans-serif" font-size="32" font-weight="900">ZYFT<tspan fill="#FFC629">.</tspan></text>
    <text y="40" fill="#444444" font-family="Inter, sans-serif" font-size="16">Marketplace de elite para talentos de elite.</text>
    
    <g transform="translate(400, 0)" fill="#B3B3B3" font-family="Inter, sans-serif" font-size="15" font-weight="500">
      <text y="0" fill="white" font-weight="900">PLATAFORMA</text>
      <text y="40">Encontrar Talentos</text>
      <text y="75">Buscar Projetos</text>
      <text y="110">Categorias</text>
      <text y="145">Preços</text>
    </g>
    
    <g transform="translate(700, 0)" fill="#B3B3B3" font-family="Inter, sans-serif" font-size="15" font-weight="500">
      <text y="0" fill="white" font-weight="900">EMPRESA</text>
      <text y="40">Sobre nós</text>
      <text y="75">Carreiras</text>
      <text y="110">Blog</text>
      <text y="145">Imprensa</text>
    </g>
    
    <g transform="translate(1000, 0)" fill="#B3B3B3" font-family="Inter, sans-serif" font-size="15" font-weight="500">
      <text y="0" fill="white" font-weight="900">SUPORTE</text>
      <text y="40">Central de Ajuda</text>
      <text y="75">Termos de Uso</text>
      <text y="110">Privacidade</text>
      <text y="145">Contato</text>
    </g>
    
    <line x1="0" y1="250" x2="1280" y2="250" stroke="#222222"/>
    <text y="300" fill="#333333" font-family="Inter, sans-serif" font-size="14">© 2026 Zyft Marketplace S.A. Feito com código e café no Brasil.</text>
  </g>
</svg>
